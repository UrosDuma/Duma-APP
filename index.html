<!doctype html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Duma Enterprise</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e3a5c">

  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duma">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1e3a5c; overflow: hidden; }

    #frame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: 0; display: block;
      background: #1e3a5c;
    }

    #splash {
      position: fixed; inset: 0; z-index: 10;
      background: #1e3a5c;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .3s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 56px; height: 56px; opacity: .85; }

    .btn {
      position: fixed; z-index: 11; left: 50%; bottom: 60px; transform: translateX(-50%);
      display: none; padding: 11px 26px;
      background: #cbb676; color: #1e3a5c; text-decoration: none;
      border-radius: 3px; font-family: system-ui, sans-serif;
      font-weight: 700; font-size: 14px;
    }
  </style>
</head>
<body>

  <iframe id="frame"
          src="https://script.google.com/macros/s/AKfycbzSCBRetWjV4y5DojPcXPDUk6oFlbt-DeG1coBoYdelYl--UsGTmyJnuX3zVlebjfl1_A/exec"
          allow="clipboard-read; clipboard-write"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div id="splash">
    <img src="./icon-192.png" alt="">
  </div>

  <a class="btn" id="direct"
     href="https://script.google.com/macros/s/AKfycbzSCBRetWjV4y5DojPcXPDUk6oFlbt-DeG1coBoYdelYl--UsGTmyJnuX3zVlebjfl1_A/exec">Otvori aplikaciju</a>

  <script>
    var frame  = document.getElementById('frame');
    var splash = document.getElementById('splash');
    var direct = document.getElementById('direct');
    var loaded = false;

    frame.addEventListener('load', function () {
      loaded = true;
      setTimeout(function () { splash.classList.add('hide'); }, 250);
    });

    setTimeout(function () {
      if (!loaded) direct.style.display = 'inline-block';
    }, 6000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>

</body>
</html>
