<!doctype html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Duma Enterprise</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e3a5c">

  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duma">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1e3a5c; font-family: Arial, sans-serif; }
    #dumaWrap {
      min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    #dumaTitle { color: #fff; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
    #dumaBtn {
      background: #2f9e5c; color: #fff; border: none; border-radius: 14px;
      padding: 18px 26px; font-size: 17px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.25); width: 100%; max-width: 340px;
    }
    #dumaBtn:active { background: #257a49; }
    #dumaSkip {
      margin-top: 18px; color: #cfe0ee; font-size: 13.5px; text-decoration: underline; cursor: pointer;
    }
    #dumaStatus {
      margin-top: 22px; color: #fff; font-size: 12.5px; opacity: .8; max-width: 340px;
    }
  </style>

  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>

  <div id="dumaWrap">
    <div id="dumaTitle">Duma Enterprise</div>
    <button id="dumaBtn" onclick="dumaKlikDozvoli()">🔔 Uključi obaveštenja i uđi u aplikaciju</button>
    <div id="dumaSkip" onclick="dumaPreskoci()">Nastavi bez obaveštenja (samo email)</div>
    <div id="dumaStatus"></div>
  </div>

  <script>
    // ===== PODESI OVDE =====
    var ONESIGNAL_APP_ID = "386c4ae2-d7f3-4084-8f5c-23a049cff8bf";
    var REDIRECT_URL = "https://script.google.com/macros/s/AKfycbzSCBRetWjV4y5DojPcXPDUk6oFlbt-DeG1coBoYdelYl--UsGTmyJnuX3zVlebjfl1_A/exec";
    // ===== KRAJ PODESAVANJA =====

    // VAŽNO: browseri (Chrome pre svega) od nedavno ZAHTEVAJU da zahtev za dozvolu notifikacija
    // bude pokrenut STVARNIM tapom/klikom korisnika - ako se pozove automatski čim se stranica
    // učita (bez klika), browser to tiho ignoriše i NIKAD ne prikaže prozor za dozvolu, bez obzira
    // na sva podešavanja telefona/browsera. Zato ovde postoji vidljivo dugme koje se MORA pritisnuti -
    // taj klik je ono što browseru "dokazuje" da je korisnik stvarno to tražio.

    function logStatus_(txt) {
      try { console.log('[DUMA]', txt); } catch (e) {}
      var el = document.getElementById('dumaStatus');
      if (el) el.textContent = txt;
    }

    var vecPreusmereno = false;
    function preusmeri_(playerId) {
      if (vecPreusmereno) return;
      vecPreusmereno = true;
      var url = REDIRECT_URL + (playerId ? ("?dumaPush=" + encodeURIComponent(playerId)) : "");
      logStatus_(playerId ? 'Push povezan, prebacujem te u aplikaciju...' : 'Nastavljam bez push-a (samo email), prebacujem te u aplikaciju...');
      window.location.replace(url);
    }

    function dumaPreskoci() {
      logStatus_('Preskačem push, nastavljam samo sa mejlom...');
      preusmeri_("");
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function (e) { logStatus_('Service worker greška: ' + e.message); });
    }

    var oneSignalSpreman = false;
    if (ONESIGNAL_APP_ID && ONESIGNAL_APP_ID.indexOf('STAVI_') !== 0) {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        try {
          await OneSignal.init({
            appId: ONESIGNAL_APP_ID,
            serviceWorkerPath: "sw.js",
            serviceWorkerParam: { scope: "/Duma-APP/" }
          });
          oneSignalSpreman = true;
          // Ako je dozvola VEĆ ranije data (npr. na povratnoj poseti), ne treba nikakav klik -
          // odmah uzmi player ID i nastavi dalje bez čekanja na dugme.
          if (OneSignal.Notifications.permission) {
            var vecId = (OneSignal.User && OneSignal.User.PushSubscription && OneSignal.User.PushSubscription.id) || "";
            if (vecId) { logStatus_('Dozvola već data, povezujem...'); preusmeri_(vecId); }
          }
        } catch (eInit) {
          logStatus_('OneSignal greška pri učitavanju: ' + (eInit && eInit.message || eInit));
        }
      });
    }

    // Klik na glavno dugme - OVO je user gesture koji browser zahteva da bi prikazao prozor.
    async function dumaKlikDozvoli() {
      var btn = document.getElementById('dumaBtn');
      btn.disabled = true;
      btn.textContent = 'Sačekaj...';
      if (!oneSignalSpreman || typeof OneSignal === 'undefined') {
        logStatus_('OneSignal još nije spreman, pokušavam ponovo za trenutak...');
        setTimeout(dumaKlikDozvoli, 700);
        btn.disabled = false;
        return;
      }
      try {
        logStatus_('Tražim dozvolu za obaveštenja — pogledaj vrh ekrana...');
        await OneSignal.Notifications.requestPermission();
        var playerId = (OneSignal.User && OneSignal.User.PushSubscription && OneSignal.User.PushSubscription.id) || "";
        if (playerId) {
          logStatus_('Obaveštenja uključena! Player ID: ' + playerId);
        } else {
          logStatus_('Dozvola nije data (odbijeno ili blokirano) - nastavljam samo sa mejlom.');
        }
        preusmeri_(playerId);
      } catch (e) {
        logStatus_('Greška: ' + (e && e.message || e) + ' - nastavljam samo sa mejlom.');
        preusmeri_("");
      }
    }
  </script>

</body>
</html>
